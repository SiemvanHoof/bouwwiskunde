<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Oefenapp om je voor te bereiden op HBO Bouwkunde: rekenen, wiskunde, natuurkunde, bouwfysica en bouwkundige begrippen.">
<meta name="theme-color" content="#2347A0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bouwwiskunde">
<script src="firebase-config.js"></script>
<script type="module">
const V='10.12.2',B='https://www.gstatic.com/firebasejs/'+V+'/';
const c=window.FIREBASE_CONFIG;
if(!c||!c.apiKey||/^VUL/.test(c.apiKey)){window.FB=null;window.dispatchEvent(new Event('fb-ready'))}
else{try{
 const [{initializeApp},A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
 const app=initializeApp(c);const auth=A.getAuth(app);const db=F.getFirestore(app);
 await A.setPersistence(auth,A.browserLocalPersistence).catch(()=>{});
 window.FB={onAuth:cb=>A.onAuthStateChanged(auth,cb),signIn:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),signUp:(e,p)=>A.createUserWithEmailAndPassword(auth,e,p),
  google:()=>A.signInWithPopup(auth,new A.GoogleAuthProvider()),reset:e=>A.sendPasswordResetEmail(auth,e),signOut:()=>A.signOut(auth),
  get:uid=>F.getDoc(F.doc(db,'users',uid)),set:(uid,d)=>F.setDoc(F.doc(db,'users',uid),d)};
}catch(e){console.error('Firebase laden mislukt',e);window.FB=null}
window.dispatchEvent(new Event('fb-ready'))}
</script>
</head>
<body>
<title>Bouwwiskunde Startblok</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
%%CSS%%
</style>

<div class="authgate" id="authGate" hidden></div>

<div id="appShell">
<div class="frame" id="frame">
  <aside class="side" aria-label="Navigatie">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 19L19 4v15z"/></svg></span>
      <span class="brand-n">Bouwwiskunde<small>startblok HBO Bouwkunde</small></span>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="navlist"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>Menu</button>
    </div>
    <nav class="navlist" id="navlist"></nav>
    <div class="side-foot"><div id="acctChip"></div><button id="resetBtn" type="button">Voortgang wissen</button></div>
  </aside>
  <div class="mainwrap">
    <header class="topbar">
      <button class="ib" id="sideToggle" aria-label="Zijbalk tonen of verbergen"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="3.5" width="15" height="13" rx="2.5"/><path d="M7.5 3.5v13"/></svg></button>
      <nav class="crumbs" id="crumbs" aria-label="Kruimelpad"></nav>
      <div class="tb-right">
        <form class="tsearch" id="tsearch" role="search"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5L17 17" stroke-linecap="round"/></svg><label class="sr" for="tsearchIn">Zoek een formule</label><input id="tsearchIn" type="search" placeholder="Zoek formule" autocomplete="off"><kbd>/</kbd></form>
        <button class="ib" id="themeBtn" aria-label="Kleuren kiezen" aria-expanded="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2.5a7.5 7.5 0 1 0 0 15c1 0 1.5-.7 1.5-1.4 0-.9-.8-1.3-.8-2.2 0-.9.7-1.6 1.6-1.6h1.6a3.6 3.6 0 0 0 3.6-3.6C17.5 5.4 14.1 2.5 10 2.5z"/><circle cx="6.5" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="6" r="1" fill="currentColor"/><circle cx="12.8" cy="6.6" r="1" fill="currentColor"/></svg></button>
        
        <a class="ib" href="#fouten" id="bellBtn" aria-label="Fouten herhalen"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 8a5 5 0 0 1 10 0c0 4 1.5 5.5 1.5 5.5h-13S5 12 5 8z"/><path d="M8.5 16a1.6 1.6 0 0 0 3 0"/></svg><span class="dotc" id="bellCount"></span></a>
        
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>

<div class="themepop" id="themePop" hidden role="dialog" aria-label="Kleuren kiezen"></div>
<button class="calc-fab" id="calcBtn" aria-expanded="false" aria-controls="calc" aria-label="Rekenmachine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M8.5 6.5h7" stroke-linecap="round"/><path d="M8.6 11h.01M12 11h.01M15.4 11h.01M8.6 14.5h.01M12 14.5h.01M15.4 14.5h.01M8.6 18h.01M12 18h.01M15.4 18h.01" stroke-linecap="round" stroke-width="2.6"/></svg></button>
<div class="calc" id="calc" hidden role="dialog" aria-label="Rekenmachine">
  <div class="calc-top"><span class="calc-mode" id="calcMode">Graden</span><button class="calc-x" id="calcClose" aria-label="Rekenmachine sluiten">×</button></div>
  <div class="calc-view" id="calcView">
    <div class="calc-disp"><label class="sr" for="calcIn">Berekening</label><input id="calcIn" type="text" autocomplete="off" spellcheck="false" placeholder="typ of tik een som"><output class="calc-res" id="calcRes">0</output></div>
    <div class="calc-sci" id="calcSci"></div>
    <div class="calc-sep"></div>
    <div class="calc-pad">
      <button class="ck fn" data-k="AC">AC</button><button class="ck fn" data-k="NEG">+/−</button><button class="ck fn" data-k="%">%</button><button class="ck op" data-k="÷" aria-label="delen">÷</button>
      <button class="ck" data-k="7">7</button><button class="ck" data-k="8">8</button><button class="ck" data-k="9">9</button><button class="ck op" data-k="×" aria-label="keer">×</button>
      <button class="ck" data-k="4">4</button><button class="ck" data-k="5">5</button><button class="ck" data-k="6">6</button><button class="ck op" data-k="−" aria-label="min">−</button>
      <button class="ck" data-k="1">1</button><button class="ck" data-k="2">2</button><button class="ck" data-k="3">3</button><button class="ck op" data-k="+" aria-label="plus">+</button>
      <button class="ck zero" data-k="0">0</button><button class="ck" data-k=",">,</button><button class="ck eq" data-k="=" aria-label="is">=</button>
    </div>
  </div>
  <div class="calc-view" id="tapeView" hidden><div class="calc-tape"><div class="tape-h"><h2>Geschiedenis</h2><button class="tape-clear" id="tapeClear">Wissen</button></div><div id="calcHist"></div></div></div>
  <nav class="calc-nav"><button id="navTape"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 10a6.5 6.5 0 1 0 2-4.7" stroke-linecap="round"/><path d="M3 3v3.5h3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 6.5V10l2.5 1.5" stroke-linecap="round"/></svg>Tape</button><button id="navCalc" class="on"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="2.5" width="12" height="15" rx="2"/><path d="M7 6h6M7.5 10h.01M10 10h.01M12.5 10h.01M7.5 13h.01M10 13h.01M12.5 13h.01" stroke-linecap="round" stroke-width="2"/></svg>Calc</button></nav>
</div>
<div id="toast" hidden role="status"></div>
<div id="celebrate" hidden role="status"></div>
</div>

<script>
%%APP_JS%%
</script>

<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body>
</html>
